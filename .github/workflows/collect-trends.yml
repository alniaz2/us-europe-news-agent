
name: Collect US and Europe Google Trends

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */2 * * *"

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect trends
        run: python collect_trends.py

      - name: Save collected trends
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/google_trends.csv
          if ! git diff --cached --quiet; then
            git commit -m "Update Google Trends collection"
            git push
          else
            echo "No new trend rows to save."
          fi
